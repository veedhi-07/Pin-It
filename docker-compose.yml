services:
  postgres:
    image: postgres:16-alpine
    container_name: pinboard-postgres
    environment:
      POSTGRES_USER: pinboard
      POSTGRES_PASSWORD: pinboard
      POSTGRES_DB: pinboard
    ports:
      - "5432:5432"
    volumes:
      - pinboard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinboard -d pinboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pinboard-redis
    ports:
      - "6379:6379"
    volumes:
      - pinboard_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pinboard_pgdata:
  pinboard_redis:
